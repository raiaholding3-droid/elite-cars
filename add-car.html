<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إضافة سيارة | رؤية النخبة للسيارات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">

    <div class="container header-content">

        <a href="index.html" class="brand">
            <span class="brand-mark">R</span>

            <div>
                <strong>رؤية النخبة</strong>
                <small>للسيارات</small>
            </div>
        </a>

        <nav class="main-nav">
            <a href="index.html">الرئيسية</a>
            <a href="cars.html">السيارات</a>
            <a href="admin.html">لوحة الإدارة</a>

            <a href="add-car.html" class="admin-link">
                إضافة سيارة
            </a>
        </nav>

        <button class="mobile-menu-button" id="mobileMenuButton">
            ☰
        </button>

    </div>

</header>


<main class="add-car-page">

    <div class="container">

        <div class="add-car-heading">

            <span class="section-badge">
                إدارة السيارات
            </span>

            <h1>إضافة سيارة جديدة</h1>

            <p>
                أدخل معلومات السيارة وسيتم حفظها في قاعدة بيانات الموقع.
            </p>

        </div>


        <form id="onlineAddCarForm" class="modern-car-form">

            <div class="form-grid">

                <div class="form-group">
                    <label for="newCarName">اسم السيارة *</label>
                    <input
                        type="text"
                        id="newCarName"
                        placeholder="GMC Yukon Denali"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newCarBrand">الماركة *</label>
                    <input
                        type="text"
                        id="newCarBrand"
                        placeholder="GMC"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newCarModel">الموديل *</label>
                    <input
                        type="text"
                        id="newCarModel"
                        placeholder="Yukon Denali"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newCarYear">السنة *</label>
                    <input
                        type="number"
                        id="newCarYear"
                        placeholder="2026"
                        min="1900"
                        max="2100"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newCarVin">رقم الشاصي VIN</label>
                    <input
                        type="text"
                        id="newCarVin"
                        maxlength="17"
                        placeholder="1GKS2DKL0TR000000"
                    >
                </div>


                <div class="form-group">
                    <label for="newCarMileage">العداد / ميل</label>
                    <input
                        type="number"
                        id="newCarMileage"
                        min="0"
                        placeholder="12500"
                    >
                </div>


                <div class="form-group">
                    <label for="newCarColor">اللون</label>
                    <input
                        type="text"
                        id="newCarColor"
                        placeholder="أسود"
                    >
                </div>


                <div class="form-group">
                    <label for="newCarFuel">نوع الوقود</label>

                    <select id="newCarFuel">
                        <option value="">اختر</option>
                        <option value="بنزين">بنزين</option>
                        <option value="ديزل">ديزل</option>
                        <option value="هايبرد">هايبرد</option>
                        <option value="Plug-in Hybrid">Plug-in Hybrid</option>
                        <option value="كهربائي">كهربائي</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="newCarBodyType">نوع السيارة</label>

                    <select id="newCarBodyType">
                        <option value="">اختر</option>
                        <option value="SUV">SUV</option>
                        <option value="Sedan">Sedan</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Coupe">Coupe</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="Minivan">Minivan</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="newCarEngine">المحرك</label>
                    <input
                        type="text"
                        id="newCarEngine"
                        placeholder="6.2L V8"
                    >
                </div>


                <div class="form-group">
                    <label for="newCarTransmission">ناقل الحركة</label>
                    <input
                        type="text"
                        id="newCarTransmission"
                        placeholder="10-Speed Automatic"
                    >
                </div>


                <div class="form-group">
                    <label for="newCarPrice">السعر بالدولار *</label>
                    <input
                        type="number"
                        id="newCarPrice"
                        min="0"
                        step="0.01"
                        placeholder="85000"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="newCarStatus">حالة السيارة</label>

                    <select id="newCarStatus">
                        <option value="متوفرة">متوفرة</option>
                        <option value="محجوزة">محجوزة</option>
                        <option value="مباعة">مباعة</option>
                    </select>
                </div>


                <div class="form-group form-full">
                    <label for="newCarDescription">وصف السيارة</label>

                    <textarea
                        id="newCarDescription"
                        rows="6"
                        placeholder="اكتب تفاصيل السيارة..."
                    ></textarea>
                </div>

            </div>


            <div id="addCarMessage" class="form-message"></div>


            <div class="form-actions">

                <button
                    type="submit"
                    id="saveCarButton"
                    class="hero-button primary-button"
                >
                    حفظ السيارة
                </button>

                <a
                    href="admin.html"
                    class="hero-button secondary-button"
                >
                    إلغاء
                </a>

            </div>

        </form>

    </div>

</main>


<script src="script.js"></script>
<script src="add-car.js"></script>

</body>
</html>
