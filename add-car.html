<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إضافة سيارة - رؤية النخبة</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        رؤية النخبة للسيارات
    </div>


    <nav>

        <a href="index.html">
            الرئيسية
        </a>

        <a href="index.html#cars">
            معرض السيارات
        </a>

        <a href="add-car.html">
            إضافة سيارة
        </a>

    </nav>

</header>


<main>

    <section class="add-car-section">

        <div class="section-title">

            <h1>
                إضافة سيارة جديدة
            </h1>

            <p>
                أضف سيارة جديدة إلى معرض رؤية النخبة للسيارات
            </p>

        </div>


        <form id="addCarForm">


            <div class="form-group">

                <label>
                    اسم السيارة
                </label>

                <input
                    type="text"
                    id="carNameInput"
                    placeholder="مثال: GMC Yukon Denali"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    الماركة
                </label>

                <input
                    type="text"
                    id="carBrandInput"
                    placeholder="مثال: GMC"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    الموديل
                </label>

                <input
                    type="text"
                    id="carModelInput"
                    placeholder="مثال: Yukon Denali"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    السنة
                </label>

                <input
                    type="number"
                    id="carYearInput"
                    placeholder="2026"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    النوع
                </label>

                <select
                    id="carTypeInput"
                    required
                >

                    <option value="">
                        اختر نوع السيارة
                    </option>

                    <option value="SUV">
                        SUV
                    </option>

                    <option value="Sedan">
                        Sedan
                    </option>

                    <option value="Truck">
                        Truck
                    </option>

                    <option value="Coupe">
                        Coupe
                    </option>

                    <option value="Convertible">
                        Convertible
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    المحرك
                </label>

                <input
                    type="text"
                    id="carEngineInput"
                    placeholder="مثال: V8 6.2L"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    ناقل الحركة
                </label>

                <input
                    type="text"
                    id="carTransmissionInput"
                    placeholder="مثال: أوتوماتيك"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    السعر
                </label>

                <input
                    type="text"
                    id="carPriceInput"
                    placeholder="مثال: $85,000"
                    required
                >

            </div>


             <div class="form-group">

              <label>
                 صور السيارة
              </label>

                  <input
                type="file"
                 id="carImagesInput"
                accept="image/*"
                 multiple
                  required
    >

                     <small>
                     اختر عدة صور. الصورة الأولى ستكون الصورة الرئيسية.
                  </small>

                  </div>


                   <div
                    id="imagePreview"
                 class="image-preview"
>
             </div>


            <div class="form-group">

                <label>
                    وصف السيارة
                </label>

                <textarea
                    id="carDescriptionInput"
                    rows="6"
                    placeholder="اكتب وصف السيارة هنا..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="add-car-button"
            >
                إضافة السيارة
            </button>


        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 شركة رؤية النخبة للسيارات
    </p>

</footer>


<script src="script.js"></script>

</body>

</html>
