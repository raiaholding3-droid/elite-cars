<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تعديل السيارة | رؤية النخبة للسيارات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="main-header">

    <div class="container header-content">

        <a
            href="index.html"
            class="brand"
        >

            <span class="brand-mark">
                R
            </span>

            <div>

                <strong>
                    رؤية النخبة
                </strong>

                <small>
                    للسيارات
                </small>

            </div>

        </a>


        <nav class="main-nav">

            <a href="index.html">
                الرئيسية
            </a>

            <a href="cars.html">
                السيارات
            </a>

            <a href="admin.html">
                لوحة الإدارة
            </a>

            <a
                href="add-car.html"
                class="admin-link"
            >
                إضافة سيارة
            </a>

        </nav>


        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
        >
            ☰
        </button>

    </div>

</header>


<main class="add-car-page">

    <div class="container">


        <div class="add-car-heading">

            <span class="section-badge">
                إدارة السيارات
            </span>

            <h1>
                تعديل بيانات السيارة
            </h1>

            <p>
                عدّل معلومات السيارة ثم اضغط حفظ التعديلات.
            </p>

        </div>


        <form
            id="editCarForm"
            class="modern-car-form"
        >


            <div class="form-grid">


                <div class="form-group">

                    <label for="editCarName">
                        اسم السيارة *
                    </label>

                    <input
                        type="text"
                        id="editCarName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCarBrand">
                        الماركة *
                    </label>

                    <input
                        type="text"
                        id="editCarBrand"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCarModel">
                        الموديل *
                    </label>

                    <input
                        type="text"
                        id="editCarModel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCarYear">
                        السنة *
                    </label>

                    <input
                        type="number"
                        id="editCarYear"
                        min="1900"
                        max="2100"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCarVin">
                        رقم الشاصي VIN
                    </label>

                    <input
                        type="text"
                        id="editCarVin"
                        maxlength="17"
                    >

                </div>


                <div class="form-group">

                    <label for="editCarMileage">
                        العداد / ميل
                    </label>

                    <input
                        type="number"
                        id="editCarMileage"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="editCarColor">
                        اللون
                    </label>

                    <input
                        type="text"
                        id="editCarColor"
                    >

                </div>


                <div class="form-group">

                    <label for="editCarFuel">
                        نوع الوقود
                    </label>

                    <select id="editCarFuel">

                        <option value="">
                            اختر
                        </option>

                        <option value="بنزين">
                            بنزين
                        </option>

                        <option value="ديزل">
                            ديزل
                        </option>

                        <option value="هايبرد">
                            هايبرد
                        </option>

                        <option value="Plug-in Hybrid">
                            Plug-in Hybrid
                        </option>

                        <option value="كهربائي">
                            كهربائي
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editCarType">
                        نوع السيارة
                    </label>

                    <select id="editCarType">

                        <option value="">
                            اختر
                        </option>

                        <option value="SUV">
                            SUV
                        </option>

                        <option value="Sedan">
                            Sedan
                        </option>

                        <option value="Pickup">
                            Pickup
                        </option>

                        <option value="Truck">
                            Truck
                        </option>

                        <option value="Coupe">
                            Coupe
                        </option>

                        <option value="Convertible">
                            Convertible
                        </option>

                        <option value="Hatchback">
                            Hatchback
                        </option>

                        <option value="Minivan">
                            Minivan
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="editCarEngine">
                        المحرك
                    </label>

                    <input
                        type="text"
                        id="editCarEngine"
                    >

                </div>


                <div class="form-group">

                    <label for="editCarTransmission">
                        ناقل الحركة
                    </label>

                    <input
                        type="text"
                        id="editCarTransmission"
                    >

                </div>


                <div class="form-group">

                    <label for="editCarPrice">
                        السعر بالدولار *
                    </label>

                    <input
                        type="number"
                        id="editCarPrice"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="editCarStatus">
                        حالة السيارة
                    </label>

                   <select id="editCarStatus">

    <option value="متوفرة">
        متوفرة
    </option>

    <option value="في الطريق">
        في الطريق
    </option>

    <option value="محجوزة">
        محجوزة
    </option>

    <option value="مباعة">
        مباعة
    </option>

</select>

                </div>


                <div class="form-group form-full">

                    <label for="editCarDescription">
                        وصف السيارة
                    </label>

                    <textarea
                        id="editCarDescription"
                        rows="6"
                    ></textarea>

                </div>


                <div class="form-group form-full">

                    <label for="editCarImages">
                        صور جديدة
                    </label>

                    <input
                        type="file"
                        id="editCarImages"
                        accept="image/*"
                        multiple
                    >

                    <small>
                        تعديل الصور سنربطه في الخطوة التالية.
                        حاليًا اترك هذا الحقل فارغًا عند حفظ البيانات.
                    </small>

                </div>


                <div
                    id="editImagePreview"
                    class="image-preview form-full"
                ></div>


            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="hero-button primary-button"
                >
                    💾 حفظ التعديلات
                </button>


                <a
                    href="admin.html"
                    class="hero-button secondary-button"
                >
                    إلغاء
                </a>

            </div>


        </form>


    </div>

</main>


<footer>

    <p>
        © 2026 شركة رؤية النخبة للسيارات
    </p>

</footer>


<script src="script.js"></script>


</body>

</html>
