<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل السيارة - رؤية النخبة</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            رؤية النخبة للسيارات
        </div>

        <nav>

            <a href="index.html">
                الرئيسية
            </a>

            <a href="#">
                معرض السيارات
            </a>

            <a href="#">
                من نحن
            </a>

            <a href="#">
                اتصل بنا
            </a>

        </nav>

    </header>


    <main>

        <section class="car-details">

    <div class="car-gallery">

    <!-- الصورة الرئيسية -->

    <div class="main-car-image">

        <img
            id="carImage"
            src=""
            alt=""
        >

    </div>


    <!-- الصور المصغرة -->

    <div
        id="carThumbnails"
        class="car-thumbnails"
    ></div>

</div>
    <div class="car-details-info">

        <h1 id="carName"></h1>

        <p id="carPrice" class="car-price"></p>

        <div class="specifications">

            <p>
                <strong>السنة:</strong>
                <span id="carYear"></span>
            </p>

            <p>
                <strong>الماركة:</strong>
                <span id="carBrand"></span>
            </p>

            <p>
                <strong>الموديل:</strong>
                <span id="carModel"></span>
            </p>

            <p>
                <strong>النوع:</strong>
                <span id="carType"></span>
            </p>

            <p>
                <strong>المحرك:</strong>
                <span id="carEngine"></span>
            </p>

            <p>
                <strong>ناقل الحركة:</strong>
                <span id="carTransmission"></span>
            </p>

        </div>

        <button onclick="contactUs()">
            تواصل معنا
        </button>

    </div>

</section>

    </main>


    <footer>

        <p>
            © 2026 شركة رؤية النخبة للسيارات
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
