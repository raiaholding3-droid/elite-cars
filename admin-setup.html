<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        إنشاء المدير الرئيسي | رؤية النخبة
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #0d1117,
                    #171c24
                );

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            color: #fff;

            padding: 20px;
        }


        .setup-box {
            width: 100%;
            max-width: 480px;

            background: #161b22;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.35);
        }


        .brand {
            text-align: center;
            margin-bottom: 30px;
        }


        .brand-mark {
            width: 64px;
            height: 64px;

            margin:
                0 auto
                15px;

            border-radius: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #c89b3c;

            color: #111;

            font-size: 30px;
            font-weight: bold;
        }


        h1 {
            margin:
                0 0 8px;

            font-size: 25px;
        }


        .subtitle {
            color: #9ba3ad;

            margin: 0;

            line-height: 1.7;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #d8dde4;

            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                1px solid
                #30363d;

            background: #0d1117;

            color: #fff;

            font-size: 16px;

            outline: none;
        }


        input:focus {
            border-color: #c89b3c;
        }


        button {
            width: 100%;

            border: 0;

            border-radius: 10px;

            padding: 15px;

            margin-top: 5px;

            cursor: pointer;

            background: #c89b3c;

            color: #111;

            font-size: 16px;
            font-weight: bold;
        }


        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .message {
            display: none;

            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            line-height: 1.7;
        }


        .message.success {
            display: block;

            background:
                rgba(
                    46,
                    160,
                    67,
                    0.15
                );

            border:
                1px solid
                #2ea043;

            color: #7ee787;
        }


        .message.error {
            display: block;

            background:
                rgba(
                    248,
                    81,
                    73,
                    0.12
                );

            border:
                1px solid
                #f85149;

            color: #ff7b72;
        }


        .warning {
            margin-top: 22px;

            font-size: 13px;

            color: #8b949e;

            text-align: center;

            line-height: 1.8;
        }

    </style>
</head>


<body>

    <div class="setup-box">

        <div class="brand">

            <div class="brand-mark">
                R
            </div>

            <h1>
                إنشاء المدير الرئيسي
            </h1>

            <p class="subtitle">
                رؤية النخبة للسيارات
            </p>

        </div>


        <form id="setupForm">

            <div class="form-group">

                <label for="fullName">
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="fullName"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    اسم المستخدم
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    minlength="4"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    تأكيد كلمة المرور
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="10"
                    required
                >

            </div>


            <button
                type="submit"
                id="createButton"
            >
                إنشاء المدير الرئيسي
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <div class="warning">
            هذه الصفحة مخصصة لإنشاء المدير الرئيسي
            لأول مرة فقط.
            <br>
            بعد نجاح العملية سنحذفها.
        </div>

    </div>


    <script>

        const setupForm =
            document.getElementById(
                "setupForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const createButton =
            document.getElementById(
                "createButton"
            );


        setupForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const fullName =
                    document
                    .getElementById(
                        "fullName"
                    )
                    .value
                    .trim();


                const username =
                    document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


                const password =
                    document
                    .getElementById(
                        "password"
                    )
                    .value;


                const confirmPassword =
                    document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


                message.className =
                    "message";

                message.textContent =
                    "";


                if (
                    password !==
                    confirmPassword
                ) {

                    showError(
                        "كلمتا المرور غير متطابقتين."
                    );

                    return;

                }


                if (
                    password.length < 10
                ) {

                    showError(
                        "كلمة المرور يجب أن تحتوي على 10 أحرف على الأقل."
                    );

                    return;

                }


                createButton.disabled =
                    true;

                createButton.textContent =
                    "جاري إنشاء الحساب...";


                try {

                    const response =
                        await fetch(
                            "/api/create-super-admin",
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        full_name:
                                            fullName,

                                        username:
                                            username,

                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "فشل إنشاء الحساب"
                        );

                    }


                    message.className =
                        "message success";

                    message.textContent =
                        "تم إنشاء المدير الرئيسي بنجاح. لا تغلق بيانات تسجيل الدخول الخاصة بك.";


                    setupForm.reset();


                }

                catch (error) {

                    showError(
                        error.message
                    );

                }

                finally {

                    createButton.disabled =
                        false;

                    createButton.textContent =
                        "إنشاء المدير الرئيسي";

                }

            }
        );


        function showError(text) {

            message.className =
                "message error";

            message.textContent =
                text;

        }

    </script>

</body>

</html>
